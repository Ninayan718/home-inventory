<html lang="zh-CN">

<link rel="icon" type="image/png" href="apple-touch-icon.png">

<style>:root{
  --bg:#FCF9F4;--card:#FFFFFF;--ink:#2B2721;--muted:#8A8177;--line:#E9E1D5;
  --soft:#F4EEE4;--accent:#B0632C;--accent-soft:#F8EADC;
  --green:#2F7A5B;--green-soft:#E6F2EA;--red:#B33A32;--red-soft:#F9E7E4;
  --blue:#3C6FA8;--blue-soft:#E8F0F8;--teal:#0F6E56;--teal-soft:#E1F5EE;
  --amber:#9A6412;--amber-soft:#FAEEDA;--gray:#6F6A62;--gray-soft:#F0ECE5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer}
.hd{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 18px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.hd h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.3px}
.hd p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.wrap{padding:16px 16px 110px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec-t h2{margin:0;font-size:15px;font-weight:600}
.sec-t .more{font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px}
.metric{background:var(--soft);border-radius:12px;padding:11px 12px}
.metric .lb{font-size:12px;color:var(--muted);margin:0}
.metric .vl{font-size:23px;font-weight:600;line-height:1.25;margin:3px 0 0;letter-spacing:-.5px}
.metric .sub{font-size:11px;color:var(--muted);margin:1px 0 0}
.metric.hot .vl{color:var(--accent)}
.banner{background:var(--amber-soft);border:1px solid #F0DDB8;border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13px;color:#6F4A0B}
.banner .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner.blue{background:var(--blue-soft);border-color:#D6E4F2;color:#2B5780}
.todo{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo .tx{flex:1;min-width:0;font-size:14px;line-height:1.45}
.todo .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chk{width:20px;height:20px;flex:0 0 20px;border:1.5px solid #C9BFAE;border-radius:6px;background:#fff;margin-top:1px;padding:0}
.chk.on{background:var(--green);border-color:var(--green);position:relative}
.chk.on:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;line-height:1.5;white-space:nowrap;font-weight:500}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.gray{background:var(--gray-soft);color:var(--gray)}
.bar-row{margin-bottom:11px}
.bar-row .lg{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-row .lg span:last-child{color:var(--muted);font-size:12px}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:#D9903F}
.bar.hi>i{background:#C4622C}
.prog{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--green);border-radius:5px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);min-height:32px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--accent)}
.item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .nm{font-size:14px;font-weight:500;word-break:break-all}
.item .mt{font-size:12px;color:var(--muted);margin-top:3px}
.item .rt{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.item .pr{font-size:13px;color:var(--ink)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.grp-t{font-size:12px;color:var(--muted);margin:16px 2px 6px;letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.dan{color:var(--red);border-color:#EBCCCA}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.btn:active{opacity:.75}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>.btn{flex:1}
label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.field{margin-bottom:12px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;min-height:42px}
.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.7;font-size:14px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.hint code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12px}
.pv{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.pv .r{display:flex;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:12px;align-items:center}
.pv .r:first-child{border-top:0;background:var(--soft);color:var(--muted)}
.pv .r .a{flex:1;min-width:0;word-break:break-all}
.pv .r .b{width:74px;color:var(--muted)}
.pv .r .c{width:60px}
.place-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.place-row:first-child{border-top:0}
.place-row .pnm{flex:1}
.place-row .cnt{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-child{border-top:0}
.kv span:last-child{font-weight:500}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px;line-height:1.7}
.tiny{font-size:12px;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted);font-size:11px;min-height:48px}
.tab.on{color:var(--accent)}
.tab .ico{width:22px;height:22px;display:block}
.modal{position:fixed;inset:0;z-index:50;background:rgba(35,30,24,.42);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:600}
.sheet .sub{font-size:12px;color:var(--muted);margin:0 0 16px}
.toast{position:fixed;z-index:80;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(43,39,33,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;max-width:86%;text-align:center}
.toast[hidden]{display:none}
.footnote{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 4px;line-height:1.7}
.sug{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.sug b{font-weight:600}
</style>
</head>

  };
  var TAB_LABEL = { today: '今天', list: '清单', add: '录入', data: '数据' };

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  function n2(x) { return String(x).padStart(2, '0'); }
  function parseDate(s) { return new Date(String(s) + 'T00:00:00'); }
  function dayDiff(a, b) {
    if (!a) return 0;
    var d1 = parseDate(a), d2 = parseDate(b || today());
    if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
    return Math.round((d2 - d1) / 86400000);
  }

  function guessCat(name) {
    var low = String(name || '').toLowerCase();
    for (var i = 0; i < C.KEYWORD_PAIRS.length; i++) {

  }

  function paoLeft(it) {
    if (!it.openedAt || !Number(it.pao)) return null;
    var d = parseDate(it.openedAt);
    if (isNaN(d.getTime())) return null;
    d.setMonth(d.getMonth() + Number(it.pao));
    var expiry = d.getFullYear() + '-' + n2(d.getMonth() + 1) + '-' + n2(d.getDate());
    return -dayDiff(expiry, today());
  }

  function idleDays(it) {
    var base = it.lastUsedAt || it.boughtAt || it.createdAt || today();
    return Math.max(0, dayDiff(base, today()));
  }

  function resalePrice(it) {
    var p = Number(it.price) || 0;
    if (!p) return 0;
    var r;
    if (it.cat === '电器' || it.cat === '数码') {
      var yrs = Math.max(0, dayDiff(it.boughtAt || it.createdAt, today()) / 365);
      r = (it.cat === '数码' ? 0.42 : 0.5) * Math.pow(0.82, yrs);
      r = Math.max(0.12, Math.min(0.7, r));
    } else if (it.status === 'sealed') {
      r = 0.62;
    } else if (it.openedAt) {
      r = it.cat === '护肤' ? 0.12 : 0.2;
    } else {
      r = 0.3;
    }
    return Math.round(p * r / 10) * 10;
  }

  function suggest(it) {
    var left = paoLeft(it), idle = idleDays(it), price = resalePrice(it), cc = catCount(it.cat);
    if (left !== null && left < 0) return { action: 'discard', reason: '已过开封保质期 ' + (-left) + ' 天', price: 0 };
    if (it.status === 'using') return { action: 'keep', reason: '正在使用，无需处理', price: 0 };
    if (left !== null && left <= 90) return { action: 'use', reason: '距开封保质期只剩 ' + left + ' 天，优先用完', price: 0 };
    if (C.LOW_FREQ_CATS.indexOf(it.cat) >= 0 && idle > 180) return { action: 'keep', reason: '低频但必要，合理保留', price: 0 };
    if ((it.cat === '电器' || it.cat === '数码') && idle >= 365) return { action: 'sell', reason: '闲置超过 1 年，折旧快，越晚卖越不值钱', price: price };
    if (it.status === 'sealed' && cc >= 3) return { action: 'sell', reason: '同类已有 ' + cc + ' 件，未拆封残值最高，适合转卖', price: price };
    if (it.status === 'sealed' && idle >= 180) return { action: 'use', reason: '未拆封闲置 ' + idle + ' 天，尽快拆来用', price: 0 };
    if (idle >= 180) return { action: 'use', reason: '已闲置 ' + idle + ' 天，放到显眼处用起来', price: 0 };

    var idle = active.filter(function (x) { return x.status !== 'using'; });
    var sunk = idle.reduce(function (a, b) { return a + (Number(b.price) || 0); }, 0);

    var toSell = active.filter(function (x) { return x.action === 'sell'; });
    var sellSum = toSell.reduce(function (a, b) { return a + (Number(b.suggestPrice) || 0); }, 0);
    var sold = all.filter(function (x) { return x.done && Number(x.soldPrice) > 0; })

    var catMap = {}, placeMap = {};

  function todoItems() {

    var sorted = pool.slice().sort(function (a, b) {
      var pa = prio[a.action] === undefined ? 9 : prio[a.action];
      var pb = prio[b.action] === undefined ? 9 : prio[b.action];
      var d = pa - pb;

      return idleDays(b) - idleDays(a);
    });
    var picked = [], used = {};
    ['discard', 'use', 'sell'].forEach(function (k) {

    sorted.forEach(function (it) {

  function parseBulk(text, defPlace) {
    var lines = String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    return lines.map(function (line) {
      var toks = line.split(/\s+/), parts = [], place = '', cat = '', st = '', price = 0, age = null;
      toks.forEach(function (t) {
        if (t.charAt(0) === '@') place = t.slice(1);
        else if (t.charAt(0) === '#') cat = t.slice(1);
        else if (t.charAt(0) === '~') st = t.slice(1);
        else if (t.charAt(0) === '¥' || t.charAt(0) === '￥') price = parseFloat(t.slice(1)) || 0;
        else parts.push(t);
      });
      var hasTag = place || cat || st || price;
      if (!hasTag && parts.length > 1 && C.CATS.indexOf(parts[parts.length - 1]) >= 0) {
        cat = parts.pop();
      }
      var name = parts.join(' ').trim();
      if (!name) return null;
      if (C.CATS.indexOf(cat) < 0) cat = '';
      if (!cat) cat = guessCat(name);
      place = place || defPlace || '未标注位置';

      var status = 'idle', last = '';
      var tag = st || ui.defAge;
      if (tag.indexOf('在用') >= 0) status = 'using';
      else if (tag.indexOf('未拆') >= 0 || tag.indexOf('未开') >= 0 || tag === 'sealed') status = 'sealed';
      else {
        status = 'idle';
        var days = 0;
        if (/半年/.test(tag)) days = 180;
        else if (/(\d+)\s*年/.test(tag)) days = parseInt(RegExp.$1, 10) * 365;
        else if (/(\d+)\s*个?月/.test(tag)) days = parseInt(RegExp.$1, 10) * 30;
        else if (/(\d+)\s*天/.test(tag)) days = parseInt(RegExp.$1, 10);
        else if (/^\d+$/.test(tag)) days = parseInt(tag, 10);
        if (days > 0) last = C.dayOffset(-days);
      }
      if (status === 'using') last = today();
      return {
        id: uid(), name: name, place: place, cat: cat, status: status, price: price,
        boughtAt: '', lastUsedAt: last, openedAt: '', pao: 0,
        action: '', suggestPrice: 0, reason: '', done: 0, doneAt: '', soldPrice: 0,
        note: '', createdAt: today()
      };

  }

  function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; ui.editId = null; }

  function saveEdit() {
    var it = find(ui.editId);
    if (!it) return;
    var oldAction = it.action;
    it.name = $('#e_name').value.trim() || it.name;
    it.place = $('#e_place').value.trim() || '未标注位置';
    it.cat = $('#e_cat').value;
    it.status = $('#e_status').value;
    it.price = Number($('#e_price').value) || 0;
    it.lastUsedAt = $('#e_last').value;
    it.boughtAt = $('#e_bought').value;
    it.openedAt = $('#e_opened').value;
    it.pao = Number($('#e_pao').value) || 0;
    it.action = $('#e_action').value;
    it.soldPrice = Number($('#e_sold').value) || 0;
    it.note = $('#e_note').value.trim();
    if (it.action !== oldAction) { it.reason = ''; it.suggestPrice = 0; }
    if (it.action === 'sell' && !it.suggestPrice) it.suggestPrice = resalePrice(it);
    save(); closeModal(); renderAll(); toast('已保存');
  }

  function toggleDone(id) {
    var it = find(id);
    if (!it) return;
    if (!it.done) {
      it.done = 1; it.doneAt = today();
      if (it.action === 'sell' && !Number(it.soldPrice)) {
        it.soldPrice = Number(it.suggestPrice) || 0;
        toast('已完成，按建议价记入回款 ' + money(it.soldPrice) + '，可在编辑里改成实际成交价');
      } else toast('已完成，归档了');
    } else { it.done = 0; it.doneAt = ''; toast('已恢复'); }
    save(); renderAll();
  }

  function doApplyAll() {
    var n = 0;
    S.items.forEach(function (it) { if (!it.done && !it.action) { applySuggest(it); n++; } });
    save(); renderAll();
    toast(n ? '已为 ' + n + ' 件生成处置建议' : '没有待决策的物品');
  }

  function commitBulk(items, mode) {
    if (!items.length) { toast('先粘贴几行物品'); return; }
    items.forEach(function (it) { S.items.push(it); });
    S.settings.addSinceBackup += items.length;
    if (S.demo) { S.items = S.items.filter(function (x) { return String(x.id).indexOf('demo-') !== 0; }); S.demo = 0; }
    save();
    ui.draft = ''; ui.preview = null;
    renderAll();
    toast('已入库 ' + items.length + ' 件' + (S.settings.addSinceBackup === items.length ? '，示例数据已自动清空' : ''));
  }

  function download(name, content, type) {
    var blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
  }

  function exportJSON() {
    download('物尽其用-备份-' + today() + '.json', JSON.stringify(S, null, 2), 'application/json;charset=utf-8');
    S.settings.addSinceBackup = 0;
    S.settings.lastBackupAt = today();
    save(); renderAll(); toast('已导出备份');
  }

  function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }

  function exportCSV() {
    var cols = ['名称', '位置', '类目', '状态', '原价', '最后使用日', '购入日', '开封日', '保质期月', '处理动作', '建议价', '实际成交价', '已完成', '完成日', '备注'];
    var rows = [cols.map(csvCell).join(',')];
    S.items.forEach(function (it) {
      rows.push([
        it.name, it.place, it.cat, (C.STATUS_META[it.status] || {}).label || '', it.price,
        it.lastUsedAt, it.boughtAt, it.openedAt, it.pao,
        (C.ACTION_META[it.action] || {}).label || '待决策', it.suggestPrice, it.soldPrice,
        it.done ? '是' : '否', it.doneAt, it.note
      ].map(csvCell).join(','));
    });
    download('物尽其用-清单-' + today() + '.csv', '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8');
    toast('已导出 CSV');
  }

  function importJSON(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        if (!o || !Array.isArray(o.items)) throw new Error('bad');
        var ids = {};
        S.items.forEach(function (x) { ids[x.id] = 1; });
        var n = 0;
        o.items.forEach(function (x) {
          if (!x || !x.id || ids[x.id]) return;
          ids[x.id] = 1; S.items.push(x); n++;
        });
        if (o.places && Array.isArray(o.places)) {
          var pn = {};
          S.places.forEach(function (p) { pn[p.name] = 1; });
          o.places.forEach(function (p) { if (p && p.name && !pn[p.name]) { S.places.push(p); pn[p.name] = 1; } });
        }
        ensureShape(); save(); renderAll();
        toast('已合并 ' + n + ' 件');
      } catch (e) { toast('文件读不出来，请选择本工具导出的 JSON'); }
    };
    fr.readAsText(file);
  }

  function onAction(act, el, e) {
    var id = el.getAttribute('data-id');
    switch (act) {
      case 'tab': case 'goto': go(el.getAttribute('data-tab')); break;
      case 'filter': ui.filter = el.getAttribute('data-v'); renderAll(); break;
      case 'group': ui.group = el.getAttribute('data-v'); renderAll(); break;
      case 'sort': ui.sort = el.getAttribute('data-v'); renderAll(); break;
      case 'apply-all': doApplyAll(); break;
      case 'today-done': toggleDone(id); break;
      case 'toggle-done': toggleDone(id); if (ui.editId && !$('#modal').hidden) closeModal(); break;
      case 'edit': openEdit(id); break;
      case 'close-modal': closeModal(); break;
      case 'adopt': {
        var a = find(id); if (a) { applySuggest(a); save(); closeModal(); renderAll(); toast('已采纳建议'); }
        break;
      }
      case 'save-edit': saveEdit(); break;
      case 'del-item': {
        var d = find(id);
        if (d && confirm('确定删除「' + d.name + '」？此操作不可撤销。')) {
          S.items = S.items.filter(function (x) { return x.id !== id; });
          save(); closeModal(); renderAll(); toast('已删除');
        }
        break;
      }
      case 'clear-demo': {
        if (!confirm('清空示例数据，开始记录自己家的物品？')) break;
        S.items = S.items.filter(function (x) { return String(x.id).indexOf('demo-') !== 0; });
        S.demo = 0; save(); renderAll(); toast('已清空示例，去「录入」开始吧'); break;
      }
      case 'clear-all': {
        if (!confirm('将清空全部 ' + S.items.length + ' 件物品和位置，确定吗？建议先导出备份。')) break;
        if (!confirm('再确认一次：清空后无法恢复。')) break;
        S = blankState(); save(); ui.q = ''; ui.draft = ''; ui.preview = null; renderAll(); toast('已清空'); break;
      }
      case 'parse': {
        ui.draft = ($('#draft') || {}).value || '';
        ui.defPlace = ($('#defPlace') || {}).value || '';
        ui.defAge = ($('#defAge') || {}).value || '365';
        ui.preview = parseBulk(ui.draft, ui.defPlace);
        var pv = $('#preview');
        if (pv) pv.innerHTML = previewHTML(ui.preview);
        renderConfirm();
        toast('解析出 ' + ui.preview.length + ' 件，确认无误再入库');
        break;
      }
      case 'confirm-add': commitBulk(ui.preview || [], 'confirm'); break;
      case 'quick-add': {
        var txt = ($('#draft') || {}).value || ui.draft;
        var pl = ($('#defPlace') || {}).value || ui.defPlace;
        var ag = ($('#defAge') || {}).value || ui.defAge;
        ui.defAge = ag;
        commitBulk(parseBulk(txt, pl), 'quick');
        break;
      }
      case 'add-place': {
        var v = (($('#newPlace') || {}).value || '').trim();
        if (!v) { toast('先填位置名'); break; }
        if (S.places.some(function (p) { return p.name === v; })) { toast('这个位置已经有了'); break; }
        S.places.push({ id: uid(), name: v, done: 0 });
        ui.newPlace = ''; ui.defPlace = v; save(); renderAll(); toast('已添加位置：' + v); break;
      }
      case 'use-place': ui.defPlace = el.getAttribute('data-name'); save(); renderAll(); toast('已设为本次清点位置'); break;
      case 'toggle-place': {
        var p = S.places.filter(function (x) { return x.id === id; })[0];
        if (p) { p.done = p.done ? 0 : 1; save(); renderAll(); }
        break;
      }
      case 'del-place': {
        S.places = S.places.filter(function (x) { return x.id !== id; });
        save(); renderAll(); toast('已删除位置（物品保留）'); break;
      }
      case 'export-json': exportJSON(); break;
      case 'export-csv': exportCSV(); break;
    }
  }

  function renderConfirm() {
    var old = $('#confirm-wrap');
    if (old) old.remove();
    if (!ui.preview || !ui.preview.length) return;
    var wrap = document.createElement('div');
    wrap.id = 'confirm-wrap';
    wrap.style.marginTop = '12px';
    wrap.innerHTML = '<button class="btn pri full" data-act="confirm-add">确认入库这 ' + ui.preview.length + ' 件</button>';
    var pv = $('#preview');
    if (pv && pv.parentNode) pv.parentNode.insertBefore(wrap, pv.nextSibling);
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'modal') { closeModal(); return; }
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    e.preventDefault();
    onAction(el.getAttribute('data-act'), el, e);
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'draft') ui.draft = t.value;
    else if (t.id === 'defPlace') ui.defPlace = t.value;
    else if (t.id === 'newPlace') ui.newPlace = t.value;
    else if (t.id === 'q') {
      ui.q = t.value;
      var lb = $('#listBody');
      if (lb) lb.innerHTML = listBodyHTML();
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'defAge') ui.defAge = t.value;
    else if (t.id === 'importFile' && t.files && t.files[0]) {
      importJSON(t.files[0]);
      t.value = '';
    }
  });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (TABS.indexOf(h) >= 0 && h !== curTab) { curTab = h; renderAll(); }
  });

  var initial = (location.hash || '').replace('#', '');
  curTab = TABS.indexOf(initial) >= 0 ? initial : 'today';
  load();
  renderAll();
})();
</script>
</body>
</html>
